[workspace]
resolver = "2"
members = [
    # ---- the α pole: the front door + local operator (client). The single outermost entry point AND
    #      the home of every operator surface's composition root; dispatches in-process to
    #      `alpha node` / `alpha mcp` / `alpha http`. `alpha demo <name>` spawns external demos from
    #      `demos/demos.json`. α and Ω are the two root poles that hold the system; cosmos/ is their
    #      common library, foundation/ the shared floor beneath both ----
    "alpha",

    # ---- the Ω pole: the federation apex / mesh side, dual to the α door. Where alpha is the local
    #      operator (client), omega is the network graph of Realms (the server/mesh). `omega` is now a
    #      lib+bin: `omega serve` boots a dedicated federation/gateway Sanctum (transport mesh +
    #      registry + omega-federator on Role::OMEGA_GATEWAY), the dual of `alpha node`. A root crate
    #      like alpha, not a cosmos vocabulary noun; it consumes the cosmology the same way alpha does.
    #      The frozen Ω WIRE CONTRACT lives in the lean cosmos/omega-contract leaf (below), so a stub
    #      gateway can parse omega.deferred without pulling this server's kernel deps ----
    "omega",

    # ---- narrated, runnable demos (stay at the root, alongside the door they exercise) ----
    "demos/walkthrough",
    "demos/federation",
    "demos/distribute",
    "demos/bestiary-live",

    # ---- shared GAWD foundations: cross-system contracts/tools Alpha CONSUMES but does not own,
    #      destined to externalize into their own repos. They sit BESIDE the cosmology (alpha + cosmos),
    #      not within it, because they are not part of it — `gawd`-prefixed per the naming rule
    #      (a name "stable across GAWD systems"). gawdxfer is the GX bulk-transfer contract sctl shares. ----
    "foundation/gawdxfer",

    # ---- the cosmology between the α and Ω poles — their common library — lives under cosmos/ ----

    # ---- substrate spine + tooling ----
    "cosmos/sigil",
    "cosmos/aether",
    "cosmos/anima",
    "cosmos/sanctum",
    "cosmos/forge",

    # ---- first-class concept crates: promoted out of aether so future authority lands in a home that
    #      already exists. abode/seer/bestiary carry live contracts; realm (= the trust domain) is an
    #      embryo that imprints the cosmology now; omega-contract is the lean Ω wire contract
    #      (omega.deferred + GATEWAY_ROLE + the reserved OmegaServices seam) the Ω server crate
    #      re-exports. Layering: aether → {seer, abode, realm, bestiary, omega-contract}
    #      (the Ω pole `omega`, at the root, consumes realm + aether + omega-contract from here) ----
    "cosmos/abode",
    "cosmos/seer",
    "cosmos/realm",
    "cosmos/bestiary",
    "cosmos/omega-contract",

    # ---- the injected model seam: a leaf crate (depends on no creature) carrying the `Model`
    #      contract so BOTH the model-backed author (agent-mind) and the Bestiary curator can consume
    #      a model with no contract-crate → creature edge. "ASI is the fabric, not the model." ----
    "cosmos/mind",

    # ---- control plane: the shared command core (omni) + the loadable surfaces
    #      (the node daemon + MCP hub composition roots live in the `alpha` crate) ----
    "cosmos/omni",
    "cosmos/creatures/surface-http",
    "cosmos/creatures/surface-mcp",

    # ---- creatures: production-capable reference organs (the real substrate creatures) ----
    "cosmos/creatures/transport-tcp",
    "cosmos/creatures/registry-mem",
    "cosmos/creatures/bestiary-daemon",
    "cosmos/creatures/build-cargo",
    "cosmos/creatures/build-critter",
    "cosmos/creatures/agent-templated",
    "cosmos/creatures/agent-curious",
    "cosmos/creatures/agent-mind",
    "cosmos/creatures/distributor-requirements",
    "cosmos/creatures/embodiment-advertiser",
    "cosmos/creatures/omega-federator",
    "cosmos/creatures/federation-scheduler",
    "cosmos/creatures/fitness-selector",
    "cosmos/creatures/immune-response",
    "cosmos/creatures/abode-migrator",
    "cosmos/creatures/abode-reconciler",
    "cosmos/creatures/verifiable-die",

    # ---- prototypes: operator-replaceable injected models (policies, scorers, weighers, …) — the
    #      reference strategy fillings for the IoC sockets. Nested under
    #      creatures/ as a reduction gradient: production organs ⊃ prototypes ⊃ fixtures ----
    # (the Rhai script prototypes under cosmos/creatures/prototypes/critters/* — including echo-critter
    #  — are source artifacts, not crates, so they are not workspace members.)
    "cosmos/creatures/prototypes/policies/policy-dev",
    "cosmos/creatures/prototypes/policies/policy-signed",
    "cosmos/creatures/prototypes/policies/policy-budget",
    "cosmos/creatures/prototypes/policies/policy-abode-allowlist",
    "cosmos/creatures/prototypes/policies/policy-prefer-promoted",
    "cosmos/creatures/prototypes/policies/policy-quarantine-aware",
    "cosmos/creatures/prototypes/policies/policy-quarantine-trust-all",
    "cosmos/creatures/prototypes/policies/policy-quarantine-trust-realm",
    "cosmos/creatures/prototypes/policies/policy-origin",
    "cosmos/creatures/prototypes/scorers/scorer-success-rate",
    "cosmos/creatures/prototypes/scorers/scorer-latency",
    "cosmos/creatures/prototypes/scorers/scorer-roundrobin",
    "cosmos/creatures/prototypes/reputation/reputation-roundrobin",
    "cosmos/creatures/prototypes/distributors/distributor-roundrobin",
    "cosmos/creatures/prototypes/gateways/realm-gateway",
    "cosmos/creatures/prototypes/gateways/omega-gateway",
    "cosmos/creatures/prototypes/merge/merge-lww-map",
    "cosmos/creatures/prototypes/monitor",

    # ---- responders: reference standing SEER consumers for the reserved topics that had a typed
    #      body but no creature to stand on them. Each binds one topic and answers Queries via the
    #      shared seer::responder skeleton; the decision is the operator-replaceable model. ----
    "cosmos/creatures/prototypes/responders/responder-policy",
    "cosmos/creatures/prototypes/responders/responder-budget",
    "cosmos/creatures/prototypes/responders/responder-fitness",
    "cosmos/creatures/prototypes/responders/responder-curation",

    # ---- fixtures: test-only creatures — the most reduced prototype (walking-skeleton + fault
    #      specimens; loaded by sanctum tests). Nested under prototypes/ ----
    "cosmos/creatures/prototypes/fixtures/echo-daemon",
    "cosmos/creatures/prototypes/fixtures/echo-daemon-v2",
    "cosmos/creatures/prototypes/fixtures/loopback-gateway",
    "cosmos/creatures/prototypes/fixtures/panic-daemon",
    "cosmos/creatures/prototypes/fixtures/runaway-thread-daemon",
    "cosmos/creatures/prototypes/fixtures/welbehaved-thread-daemon",
]
[workspace.package]
version = "0.4.2"
edition = "2021"
authors = ["Alex Grenier <alex@gawd.ai>"]
license = "GPL-3.0-or-later"
homepage = "https://gawd.ai"
repository = "https://github.com/gawd-ai/alpha"
# Source-only workspace: every member sets `publish.workspace = true`, so nothing is
# published to crates.io. Distribution is clone-and-build; on Alpha the distributable
# unit is the creature (a signed gawd_creature_v1 artifact), fetched by content address
# over the bus (the registry role; a durable Bestiary is on the roadmap).
publish = false

# WORKSPACE INVARIANT: no member may set a custom `#[global_allocator]`.
# The native FFI seam currently does `Box::from_raw` on the host side over memory the creature
# allocated inside its `.so` (the vtable). This is only sound while both sides share one allocator.
# Lifting this requires the ABI extension that lets the creature free its own vtable (a
# `gawd_creature_v1_destroy` symbol or a `vtable_drop` slot in `CreatureVTableV1`). Until then, any
# crate that introduces jemalloc / mimalloc / etc. silently risks UB on every native unload.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libloading = "0.8"
ring = "0.17"
sha2 = "0.10"
# wasmtime is a direct dependency of anima (the beast tier), not hoisted here.
# ctrlc backs the `alpha` binary's clean SIGINT/SIGTERM shutdown only — it never enters a library
# crate (the kernel spine stays dependency-light and signal-agnostic; time/signals are operator concerns).
ctrlc = "3"

[profile.release]
# Smaller shipped binaries (alpha / the demos). Symbol stripping is purely a size win.
strip = true
# DO NOT set `panic = "abort"`. The fabric-integrity floor (R9) relies on `std::panic::catch_unwind`
# at every creature boundary — the drain loop (sanctum::run_drain) and the native FFI glue
# (forge::glue) catch a panicking creature and route it to unload instead of crashing the node.
# `abort` would make those catches impossible and turn any creature panic into a node kill. Unwind
# (the default) is load-bearing here, not a default we just never changed.
