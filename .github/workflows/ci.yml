name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:

# A newer push supersedes an older candidate on the same ref. Never run two cold Rust jobs
# concurrently for one branch, and never tag a commit whose run was cancelled by a newer candidate
# (RELEASE.md's exact-run check fails closed in that case).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  # CI does clean builds, so incremental compilation only bloats the runner disk (it grows
  # `target/` with rebuild scaffolding that is never reused across a fresh job). Off.
  CARGO_INCREMENTAL: "0"
  # Local profiles retain line tables for useful backtraces. The cold hosted sanity gate has no
  # reuse value for debug sections, and its one linked test binary needs no debug payload.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TEST_THREADS: "1"

jobs:
  ci:
    name: fmt · hygiene · typecheck · contract smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Patch hygiene compares the checked-out commit (or PR merge commit) with its base.
          fetch-depth: 2

      # Wasmtime's optional `parallel-compilation` feature creates a Rayon pool outside Cargo's
      # one-job limit. Check the source declarations before compiling anything so resource-posture
      # drift fails before it can fan out or populate a large target tree.
      - name: Wasmtime serial-compilation guard
        run: |
          set -eu
          declarations="$(find . -path ./target -prune -o -name Cargo.toml -type f \
            -exec grep -lE '^[[:space:]]*wasmtime[[:space:]]*=' {} + | LC_ALL=C sort)"
          test "$declarations" = "./cosmos/anima/Cargo.toml"
          grep -Fqx \
            'wasmtime = { version = "46.0.2", default-features = false, features = ["cranelift", "runtime"] }' \
            cosmos/anima/Cargo.toml
          if grep -Eq '^name = "rayon(-core)?"$' Cargo.lock; then
            echo "Rayon entered Cargo.lock; refusing a compiler pool outside the one-CPU boundary" >&2
            exit 1
          fi

      # rust-toolchain.toml selects the exact release toolchain + required components
      # (rustfmt, clippy).
      # `rustup show` installs them on first use.
      - name: Set up Rust (from rust-toolchain.toml)
        run: rustup show

      # Cargo's one build job does not constrain LLVM, the linker, or test subprocesses. Select the
      # first CPU in this runner's allowed cpuset; every heavyweight command below starts through
      # `taskset`, and its children inherit that affinity. This is a hard CPU boundary, unlike
      # `nice`, and works when containers expose a non-zero-based cpuset (for example 8-15).
      - name: Select one-CPU execution boundary
        run: |
          allowed="$(taskset -pc $$ | sed 's/^.*: //')"
          first="${allowed%%[-,]*}"
          test -n "$first"
          taskset --cpu-list "$first" true
          echo "ALPHA_CI_CPU=$first" >> "$GITHUB_ENV"

      # Cache only Cargo downloads — never `target/`. A target cache grows stale hashed Wasmtime
      # artifacts across commits and can overflow the hosted runner. Dependency downloads are safe
      # to reuse; every sanity candidate is still compiled from a clean target tree.
      - name: Cache cargo registry + git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Patch hygiene
        run: git diff --check HEAD^ HEAD

      # The cluster runbook remains executable documentation. Parse every script before compiling so
      # a shell-language regression cannot ship behind otherwise-green Rust gates.
      - name: Operator/release script syntax
        run: |
          set -eu
          for script in demos/cluster/*.sh tools/*.sh; do
            test -x "$script"
            bash -n "$script"
          done

      # Fail immediately if Cargo.lock cannot describe the checked-in manifests. This performs no
      # compilation and makes the lock invariant explicit instead of relying on a later command.
      - name: Locked dependency graph
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo metadata --locked --no-deps --format-version 1 > /dev/null

      # Hosted CI is a sanity signal, not the release-validation machine. Type-check the two public
      # poles plus the v0.5 collaboration surface (including its opt-in provider cfg), but do not
      # link the Wasmtime-heavy dialogue test graph or fan out across workspace targets. Workspace
      # Clippy and all linked/composed validation belong to tools/local-validation.sh.
      - name: Typecheck smoke (public poles and v0.5 dialogue)
        run: |
          taskset --cpu-list "$ALPHA_CI_CPU" cargo check --locked \
            -p alpha -p omega -p dialogue \
            --lib --bins --features alpha/openai,dialogue/openai

      # Keep only leaf-level sanity tests linked on the constrained runner: provider endpoint/config
      # handling and the shared Function/Job wire contract. Full dialogue, workspace, integration,
      # demo, docs, Clippy, and live-model validation remain local release gates.
      - name: Contract smokes (model seam + Function/Job wire; no network)
        run: |
          taskset --cpu-list "$ALPHA_CI_CPU" cargo test --locked \
            -p mind -p gawdfn --features mind/openai --lib -- --test-threads=1

  # Supply-chain + license gate (config in `deny.toml`). Runs in parallel with the sanity job:
  # a new dependency carrying a security advisory, an out-of-policy license, or an unexpected
  # source fails CI rather than landing silently. `--all-features` is REQUIRED here: the modern
  # cargo resolver prunes unused optional deps from `cargo metadata`, so without it the `ureq`/TLS/
  # ICU tree (Unicode-3.0, CDLA-Permissive-2.0) is invisible to the gate.
  deny:
    name: cargo-deny (advisories · bans · licenses · sources — incl. the openai tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
          command: check
