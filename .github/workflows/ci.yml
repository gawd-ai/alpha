name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# A newer push supersedes an older candidate on the same ref. Never run two Wasmtime-heavy clean
# workspaces concurrently for one branch, and never tag a commit whose run was cancelled by a newer
# candidate (RELEASE.md's exact-run check fails closed in that case).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  # CI does clean builds, so incremental compilation only bloats the runner disk (it grows
  # `target/` with rebuild scaffolding that is never reused across a fresh job). Off.
  CARGO_INCREMENTAL: "0"
  # Local profiles retain line tables for useful backtraces. The clean hosted gate has no reuse
  # value for debug sections, and dozens of Wasmtime-linked integration binaries can otherwise
  # exhaust the runner disk even though their executable behavior is identical.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TEST_THREADS: "1"

jobs:
  ci:
    name: fmt · clippy · build · docs · test · all demos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Patch hygiene compares the checked-out commit (or PR merge commit) with its base.
          fetch-depth: 2

      # Wasmtime's optional `parallel-compilation` feature creates a Rayon pool outside Cargo's
      # one-job limit. Check the source declarations before compiling anything so resource-posture
      # drift fails before it can fan out or populate a large target tree.
      - name: Wasmtime serial-compilation guard
        run: |
          set -eu
          declarations="$(find . -path ./target -prune -o -name Cargo.toml -type f \
            -exec grep -lE '^[[:space:]]*wasmtime[[:space:]]*=' {} + | LC_ALL=C sort)"
          test "$declarations" = "./cosmos/anima/Cargo.toml"
          grep -Fqx \
            'wasmtime = { version = "46.0.2", default-features = false, features = ["cranelift", "runtime"] }' \
            cosmos/anima/Cargo.toml
          if grep -Eq '^name = "rayon(-core)?"$' Cargo.lock; then
            echo "Rayon entered Cargo.lock; refusing a compiler pool outside the one-CPU boundary" >&2
            exit 1
          fi

      # rust-toolchain.toml selects the exact release toolchain + required components
      # (rustfmt, clippy).
      # `rustup show` installs them on first use.
      - name: Set up Rust (from rust-toolchain.toml)
        run: rustup show

      # Cargo's one build job does not constrain LLVM, the linker, or test subprocesses. Select the
      # first CPU in this runner's allowed cpuset; every heavyweight command below starts through
      # `taskset`, and its children inherit that affinity. This is a hard CPU boundary, unlike
      # `nice`, and works when containers expose a non-zero-based cpuset (for example 8-15).
      - name: Select one-CPU execution boundary
        run: |
          allowed="$(taskset -pc $$ | sed 's/^.*: //')"
          first="${allowed%%[-,]*}"
          test -n "$first"
          taskset --cpu-list "$first" true
          echo "ALPHA_CI_CPU=$first" >> "$GITHUB_ENV"

      # Cache only the cargo download caches — NOT `target/`. This workspace statically links
      # wasmtime into nearly every binary (~220 MB each with debuginfo), so a cached `target/` grows
      # without bound across commits (cargo never GCs stale hashed artifacts) and, decompressed, was
      # overflowing the hosted runner's ~14 GB disk. The registry/git caches give the real speedup
      # (no re-download / re-index); `target/` rebuilds from them fast enough.
      - name: Cache cargo registry + git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Patch hygiene
        run: git diff --check HEAD^ HEAD

      # The cluster runbook remains executable documentation. Parse every script before compiling so
      # a shell-language regression cannot ship behind otherwise-green Rust gates.
      - name: Cluster runbook syntax
        run: |
          set -eu
          for script in demos/cluster/*.sh; do
            test -x "$script"
            bash -n "$script"
          done

      - name: Clippy (warnings are errors)
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo build --locked --workspace

      # Reuse the workspace build above: this wrapper invokes no Cargo command and leaves no node
      # running. Its whole process tree inherits the selected CPU, while timeout + the wrapper's
      # exact-incarnation teardown bound both the behavioral proof and every exit path.
      - name: Demo — cluster runbook (three processes, gossip, cross-run, remote MCP)
        timeout-minutes: 5
        env:
          ALPHA_CLUSTER_RUN: ${{ runner.temp }}/alpha-cluster-${{ github.run_id }}-${{ github.run_attempt }}
          BIN: ${{ github.workspace }}/target/debug/alpha
          MCP: ${{ github.workspace }}/target/debug/alpha
          OMEGA: ${{ github.workspace }}/target/debug/omega
        run: |
          taskset --cpu-list "$ALPHA_CI_CPU" \
            timeout --signal=TERM --kill-after=45s 180s \
            demos/cluster/ci-smoke.sh

      - name: Docs (rustdoc warnings are errors)
        run: |
          taskset --cpu-list "$ALPHA_CI_CPU" env RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          # The documentation result has already been gated and no later phase consumes rendered
          # HTML. Remove only this exact generated tree; keep compiled dependencies for tests/demos.
          cargo clean --doc

      # The suite includes the composed end-to-end loops and the cargo-compile
      # tests, so the first compile in this job is heavy; later gates reuse this job's `target/`.
      - name: Test
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo test --locked --workspace -- --test-threads=1

      # The α front door: a smoke test that the single entry point builds and dispatches.
      # `alpha node` / `alpha mcp` / `alpha demo` are exercised by the workspace tests above;
      # the standalone demo crates are gated below. `version` proves the front-door dispatch itself.
      - name: Front door — alpha version (the α entry point dispatches)
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo run --locked -p alpha -- version

      - name: Fabric pole — omega version (the Ω entry point dispatches)
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo run --locked -p omega -- version

      # The onboarding demo is the first thing a newcomer runs; gate it in CI so it
      # can never silently rot. It drives a real author→compile→sign→load→run→migrate
      # loop (the authoring step shells out to cargo), so it is compile-heavy on a cold cache.
      - name: Demo — walkthrough (the onboarding loop runs end to end)
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo run --locked -p walkthrough

      # The federation demo boots several Sanctums across 2–3 Realms over real loopback TCP and
      # narrates the cross-node + cross-Realm fabric; gate the default 2×2 so the multi-node path
      # can never silently rot. Fast (seconds) — no cargo authoring in this one.
      - name: Demo — federation (the multi-Realm fabric runs end to end)
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo run --locked -p federation

      # These two bounded applications are separate public demos, not aliases for the workspace
      # tests. Execute their real binaries so registry/docs drift cannot leave a compiling but
      # unusable example behind.
      - name: Demo — distribute (bounded GX fetch-load runs end to end)
        run: taskset --cpu-list "$ALPHA_CI_CPU" cargo run --locked -p distribute

      # The workspace build above already produced the binary, so run it directly and avoid a second
      # outer Cargo frontend/target mutation. The all-tier proof intentionally performs exactly one
      # nested BuildCargo compile in target/gawd-build-cache; BuildCargo serializes the finite cache
      # and pins one build job, one codegen unit, no incremental compilation, and its own timeout.
      # CPU affinity and low priority are inherited by that child compiler.
      # BuildBeast/BuildCritter invoke no Cargo, and the six Job executions reuse those three outputs.
      # This is the strict scripted fixture: a credential-free regression of causal validation,
      # trusted affine lowering, all three builders, durable proofs, and six Jobs. It deliberately
      # produces no product-acceptance claim. v0.5 acceptance additionally requires a fresh live run
      # on the exact clean commit with retained provider receipts and an operator-signed evidence seal.
      - name: Demo — dialogue fixture (all-tier regression; not live product evidence)
        timeout-minutes: 10
        run: |
          taskset --cpu-list "$ALPHA_CI_CPU" \
            nice -n 10 \
            timeout --signal=TERM --kill-after=30s 540s \
            target/debug/dialogue --fixture

      # The opt-in real-model author (`agent-mind`), `bestiary-live`, and three-role `dialogue` model
      # paths live behind `--features openai`, which links `ureq` + a ring-backed rustls TLS stack
      # the default build never touches. Gate those cfg branches so the composition roots and
      # creatures cannot rot.
      # No live model call is made in CI (no network, no key): this compiles and clippies the feature
      # branches and runs model-independent unit tests. Passing this step cannot substitute for the
      # exact-commit retained live acceptance ceremony documented in RELEASE.md and TRD-007.
      - name: Clippy + test (the opt-in `openai` features)
        run: |
          taskset --cpu-list "$ALPHA_CI_CPU" cargo clippy --locked -p agent-mind --all-targets --features openai -- -D warnings
          taskset --cpu-list "$ALPHA_CI_CPU" cargo clippy --locked -p alpha --features openai -- -D warnings
          taskset --cpu-list "$ALPHA_CI_CPU" cargo clippy --locked -p bestiary-live --all-targets --features openai -- -D warnings
          taskset --cpu-list "$ALPHA_CI_CPU" cargo clippy --locked -p dialogue --all-targets --features openai -- -D warnings
          taskset --cpu-list "$ALPHA_CI_CPU" cargo test --locked -p agent-mind --features openai -- --test-threads=1
          # Credential-free/no-network tests exercise dialogue's live-role configuration,
          # endpoint/key-file validation, and fail-closed preflight without making provider calls.
          taskset --cpu-list "$ALPHA_CI_CPU" cargo test --locked -p dialogue --features openai -- --test-threads=1
          # Exercise the public opt-in demo binary without credentials. Its no-model path must stay
          # bounded, make no network call, explain the opt-in, and exit successfully.
          taskset --cpu-list "$ALPHA_CI_CPU" env -u ALPHA_LLM_MODEL -u ALPHA_LLM_API_KEY \
            cargo run --locked -p bestiary-live --features openai

  # Supply-chain + license gate (config in `deny.toml`). Runs in parallel with the build job:
  # a new dependency carrying a security advisory, an out-of-policy license, or an unexpected
  # source fails CI rather than landing silently. `--all-features` is REQUIRED here: the modern
  # cargo resolver prunes unused optional deps from `cargo metadata`, so without it the `ureq`/TLS/
  # ICU tree (Unicode-3.0, CDLA-Permissive-2.0) is invisible to the gate.
  deny:
    name: cargo-deny (advisories · bans · licenses · sources — incl. the openai tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
          command: check
