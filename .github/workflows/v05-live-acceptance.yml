name: v0.5 live acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact full commit SHA already proven by the required CI workflow
        required: true
        type: string

# This is one release ceremony, globally. A later dispatch waits; it never cancels or overlaps the
# protected proof already using provider credentials and an append-only freshness registry.
concurrency:
  group: v05-live-acceptance
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  # This is a clean ephemeral proof build; retained line tables have no debugger reuse value and
  # make the Wasmtime-heavy target needlessly pressure the hosted runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  live-acceptance:
    name: exact-commit retained live proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: v05-live-acceptance

    steps:
      # Refuse a dispatch whose selected ref and explicit candidate disagree before fetching or
      # compiling anything. `HEAD` is checked independently after checkout.
      - name: Validate dispatched candidate identity
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "candidate_sha must be one full lowercase Git object ID" >&2
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$DISPATCH_SHA" ]]; then
            echo "candidate_sha does not equal the workflow_dispatch github.sha" >&2
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${CANDIDATE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          submodules: false

      - name: Assert candidate, dispatch, and HEAD are identical and clean
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$head_sha" = "$CANDIDATE_SHA"
          test "$head_sha" = "$DISPATCH_SHA"
          tree_status="$(git status \
            --porcelain=v1 --untracked-files=normal --ignore-submodules=none)" || exit 1
          test -z "$tree_status"

          workspace_version="$(awk '
            $0 == "[workspace.package]" { in_workspace_package = 1; next }
            in_workspace_package && /^\[/ { exit }
            in_workspace_package && $1 == "version" {
              gsub(/\"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          test "$workspace_version" = "0.5.0"
          grep -Fxq '## 0.5.0 - 2026-08-18' CHANGELOG.md
          if grep -Fxq '## Unreleased' CHANGELOG.md; then
            echo "v0.5.0 candidate changelog is not frozen" >&2
            exit 1
          fi
          grep -Fxq 'VERSION=v0.5.0' RELEASE.md
          grep -Fxq 'PREVIOUS_VERSION=v0.4.4' RELEASE.md
          grep -Fxq 'RELEASE_DATE=2026-08-18' RELEASE.md

      # Product acceptance may only follow the complete push-triggered CI gate. Query Actions again
      # here instead of trusting the dispatcher's description or a branch status from another SHA.
      - name: Require successful push CI for the exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null
          runs="$(gh run list \
            --repo "$GH_REPO" \
            --workflow ci.yml \
            --event push \
            --commit "$CANDIDATE_SHA" \
            --limit 100 \
            --json databaseId,headSha,event,conclusion)"
          ci_run_id="$(jq -r --arg sha "$CANDIDATE_SHA" '
            [.[] | select(
              .headSha == $sha and .event == "push" and .conclusion == "success"
            ) | .databaseId] | first // empty
          ' <<<"$runs")"
          if [[ ! "$ci_run_id" =~ ^[0-9]+$ ]]; then
            echo "no successful push-triggered CI run exists for the exact candidate" >&2
            exit 1
          fi

          run="$(gh run view "$ci_run_id" \
            --repo "$GH_REPO" \
            --json databaseId,headSha,event,conclusion,workflowName)"
          jq -e --argjson id "$ci_run_id" --arg sha "$CANDIDATE_SHA" '
            .databaseId == $id
            and .headSha == $sha
            and .event == "push"
            and .conclusion == "success"
            and .workflowName == "CI"
          ' <<<"$run" >/dev/null
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_SHA"

      # Cargo's one job does not bind rustc, LLVM, the linker, or the nested BuildCargo process.
      # Every heavyweight process starts on the first CPU in the runner's allowed cpuset and its
      # children inherit that hard boundary.
      - name: Select one allowed CPU and private runner layout
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          allowed="$(taskset -pc $$ | sed 's/^.*: //')"
          first="${allowed%%[-,]*}"
          [[ "$first" =~ ^[0-9]+$ ]]
          taskset --cpu-list "$first" true

          run_root="$RUNNER_TEMP/alpha-v05-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$run_root"
          install -d -m 0700 "$run_root" "$run_root/bin" "$run_root/output"
          run_root="$(realpath "$run_root")"
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          case "$run_root" in
            "$workspace_root"|"$workspace_root"/*)
              echo "live-acceptance state must be outside the checkout" >&2
              exit 1
              ;;
          esac

          echo "ALPHA_V05_CPU=$first" >> "$GITHUB_ENV"
          echo "ALPHA_V05_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          echo "ALPHA_V05_OUTPUT_ROOT=$run_root/output" >> "$GITHUB_ENV"

      # No protected live-acceptance/provider/operator secret is referenced or materialized until
      # this build is complete and its exact output has been copied outside the checkout. There is
      # deliberately no Cargo/target cache.
      - name: Build and retain the exact secret-free dialogue binary
        id: binary
        shell: bash
        env:
          ALPHA_DIALOGUE_BUILD_COMMIT: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$ALPHA_DIALOGUE_BUILD_COMMIT"
          tree_status="$(git status \
            --porcelain=v1 --untracked-files=normal --ignore-submodules=none)" || exit 1
          test -z "$tree_status"

          taskset --cpu-list "$ALPHA_V05_CPU" \
            nice -n 10 \
            timeout --signal=TERM --kill-after=30s 900s \
            cargo build --locked -p dialogue --features openai

          source_binary="$GITHUB_WORKSPACE/target/debug/dialogue"
          test -f "$source_binary"
          test ! -L "$source_binary"
          test -x "$source_binary"
          source_sha="$(sha256sum "$source_binary" | awk '{print $1}')"
          [[ "$source_sha" =~ ^[0-9a-f]{64}$ ]]
          retained_binary="$ALPHA_V05_RUN_ROOT/bin/dialogue-$source_sha"
          test ! -e "$retained_binary"
          install -m 0500 "$source_binary" "$retained_binary"
          retained_sha="$(sha256sum "$retained_binary" | awk '{print $1}')"
          test "$source_sha" = "$retained_sha"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$ALPHA_DIALOGUE_BUILD_COMMIT"
          tree_status="$(git status \
            --porcelain=v1 --untracked-files=normal --ignore-submodules=none)" || exit 1
          test -z "$tree_status"

          echo "ALPHA_V05_DIALOGUE_BIN=$retained_binary" >> "$GITHUB_ENV"
          echo "ALPHA_V05_DIALOGUE_SHA256=$retained_sha" >> "$GITHUB_ENV"
          echo "path=$retained_binary" >> "$GITHUB_OUTPUT"
          echo "sha256=$retained_sha" >> "$GITHUB_OUTPUT"

      # Required protected environment configuration:
      #   vars:    ALPHA_DIALOGUE_{BUILDER,REVIEWER,CONTRACT_TESTER}_{MODEL,BASE_URL,TIMEOUT_SECS}
      #   secrets: ALPHA_DIALOGUE_{BUILDER,REVIEWER,CONTRACT_TESTER}_API_KEY
      #            V05_EVIDENCE_SIGNING_SEED_HEX, V05_EXPECTED_EVIDENCE_SIGNER,
      #            V05_PRIOR_SEMANTIC_REGISTRY_JSON (`[]` is the explicit first-run registry),
      #            V05_EVIDENCE_ENCRYPTION_PUBLIC_KEY (one armored OpenPGP public key), and
      #            V05_EVIDENCE_ENCRYPTION_RECIPIENT (that key's full fingerprint).
      #
      # Raw output is never printed and never enters the upload directory. The EXIT trap removes
      # role credentials, operator seed, raw prompts/completions, plaintext archives, and GnuPG home
      # on success and failure. Do not add xtrace to this step.
      - name: Run, independently verify, package, and encrypt the live proof
        id: package
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDER_MODEL: ${{ vars.ALPHA_DIALOGUE_BUILDER_MODEL }}
          BUILDER_BASE_URL: ${{ vars.ALPHA_DIALOGUE_BUILDER_BASE_URL }}
          BUILDER_TIMEOUT_SECS: ${{ vars.ALPHA_DIALOGUE_BUILDER_TIMEOUT_SECS }}
          REVIEWER_MODEL: ${{ vars.ALPHA_DIALOGUE_REVIEWER_MODEL }}
          REVIEWER_BASE_URL: ${{ vars.ALPHA_DIALOGUE_REVIEWER_BASE_URL }}
          REVIEWER_TIMEOUT_SECS: ${{ vars.ALPHA_DIALOGUE_REVIEWER_TIMEOUT_SECS }}
          CONTRACT_TESTER_MODEL: ${{ vars.ALPHA_DIALOGUE_CONTRACT_TESTER_MODEL }}
          CONTRACT_TESTER_BASE_URL: ${{ vars.ALPHA_DIALOGUE_CONTRACT_TESTER_BASE_URL }}
          CONTRACT_TESTER_TIMEOUT_SECS: ${{ vars.ALPHA_DIALOGUE_CONTRACT_TESTER_TIMEOUT_SECS }}
          BUILDER_API_KEY: ${{ secrets.ALPHA_DIALOGUE_BUILDER_API_KEY }}
          REVIEWER_API_KEY: ${{ secrets.ALPHA_DIALOGUE_REVIEWER_API_KEY }}
          CONTRACT_TESTER_API_KEY: ${{ secrets.ALPHA_DIALOGUE_CONTRACT_TESTER_API_KEY }}
          EVIDENCE_SIGNING_SEED_HEX: ${{ secrets.V05_EVIDENCE_SIGNING_SEED_HEX }}
          EXPECTED_EVIDENCE_SIGNER: ${{ secrets.V05_EXPECTED_EVIDENCE_SIGNER }}
          PRIOR_SEMANTIC_REGISTRY_JSON: ${{ secrets.V05_PRIOR_SEMANTIC_REGISTRY_JSON }}
          ENCRYPTION_PUBLIC_KEY: ${{ secrets.V05_EVIDENCE_ENCRYPTION_PUBLIC_KEY }}
          ENCRYPTION_RECIPIENT: ${{ secrets.V05_EVIDENCE_ENCRYPTION_RECIPIENT }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          export LC_ALL=C

          private_root="$ALPHA_V05_RUN_ROOT/private"
          test ! -e "$private_root"
          install -d -m 0700 "$private_root"
          printf '%s\n' 'alpha-v05-live-acceptance-private-v1' > "$private_root/.owned"

          cleanup_private() {
            cleanup_status=$?
            trap - EXIT HUP INT TERM
            if [[ "$private_root" != "$ALPHA_V05_RUN_ROOT/private" ]] \
              || [[ ! -f "$private_root/.owned" ]] \
              || [[ "$(<"$private_root/.owned")" != "alpha-v05-live-acceptance-private-v1" ]]; then
              echo "private cleanup ownership check failed" >&2
              exit 1
            fi
            chmod -R u+rwX "$private_root" 2>/dev/null || cleanup_status=1
            rm -rf -- "$private_root" || cleanup_status=1
            exit "$cleanup_status"
          }
          trap cleanup_private EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          command -v gpg >/dev/null
          command -v jq >/dev/null
          command -v sha256sum >/dev/null
          test -f "$ALPHA_V05_DIALOGUE_BIN"
          test ! -L "$ALPHA_V05_DIALOGUE_BIN"
          test -x "$ALPHA_V05_DIALOGUE_BIN"
          test "$(sha256sum "$ALPHA_V05_DIALOGUE_BIN" | awk '{print $1}')" \
            = "$ALPHA_V05_DIALOGUE_SHA256"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_SHA"
          tree_status="$(git status \
            --porcelain=v1 --untracked-files=normal --ignore-submodules=none)" || exit 1
          test -z "$tree_status"

          required_values=(
            BUILDER_MODEL BUILDER_BASE_URL BUILDER_TIMEOUT_SECS
            REVIEWER_MODEL REVIEWER_BASE_URL REVIEWER_TIMEOUT_SECS
            CONTRACT_TESTER_MODEL CONTRACT_TESTER_BASE_URL CONTRACT_TESTER_TIMEOUT_SECS
            BUILDER_API_KEY REVIEWER_API_KEY CONTRACT_TESTER_API_KEY
            EVIDENCE_SIGNING_SEED_HEX EXPECTED_EVIDENCE_SIGNER
            PRIOR_SEMANTIC_REGISTRY_JSON ENCRYPTION_PUBLIC_KEY ENCRYPTION_RECIPIENT
          )
          for variable in "${required_values[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "required protected live-acceptance value $variable is absent" >&2
              exit 1
            fi
          done
          for timeout_value in \
            "$BUILDER_TIMEOUT_SECS" "$REVIEWER_TIMEOUT_SECS" "$CONTRACT_TESTER_TIMEOUT_SECS"; do
            [[ "$timeout_value" =~ ^([1-9]|[1-9][0-9]|1[01][0-9]|120)$ ]]
          done
          [[ "$EVIDENCE_SIGNING_SEED_HEX" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_EVIDENCE_SIGNER" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$ENCRYPTION_RECIPIENT" =~ ^[0-9A-Fa-f]{40}$ ]] \
            || [[ "$ENCRYPTION_RECIPIENT" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            encryption_recipient="${ENCRYPTION_RECIPIENT^^}"
          else
            echo "encryption recipient must be one full OpenPGP fingerprint" >&2
            exit 1
          fi

          secrets_dir="$private_root/secrets"
          gnupg_home="$private_root/gnupg"
          evidence_dir="$private_root/evidence"
          raw_stage="$private_root/raw-package"
          safe_stage="$private_root/verification-pack"
          install -d -m 0700 "$secrets_dir" "$gnupg_home" "$raw_stage" "$safe_stage"

          builder_key_file="$secrets_dir/builder-api-key"
          reviewer_key_file="$secrets_dir/reviewer-api-key"
          contract_tester_key_file="$secrets_dir/contract-tester-api-key"
          signing_seed_file="$secrets_dir/operator-evidence-seed.hex"
          registry_file="$secrets_dir/prior-semantic-registry.json"
          encryption_key_file="$secrets_dir/encryption-recipient.asc"
          install -m 0600 /dev/null "$builder_key_file"
          install -m 0600 /dev/null "$reviewer_key_file"
          install -m 0600 /dev/null "$contract_tester_key_file"
          install -m 0600 /dev/null "$signing_seed_file"
          install -m 0600 /dev/null "$registry_file"
          install -m 0600 /dev/null "$encryption_key_file"
          printf '%s' "$BUILDER_API_KEY" > "$builder_key_file"
          printf '%s' "$REVIEWER_API_KEY" > "$reviewer_key_file"
          printf '%s' "$CONTRACT_TESTER_API_KEY" > "$contract_tester_key_file"
          printf '%s\n' "$EVIDENCE_SIGNING_SEED_HEX" > "$signing_seed_file"
          printf '%s\n' "$PRIOR_SEMANTIC_REGISTRY_JSON" > "$registry_file"
          printf '%s\n' "$ENCRYPTION_PUBLIC_KEY" > "$encryption_key_file"
          chmod 0600 "$builder_key_file" "$reviewer_key_file" "$contract_tester_key_file" \
            "$signing_seed_file" "$registry_file" "$encryption_key_file"

          unset BUILDER_API_KEY REVIEWER_API_KEY CONTRACT_TESTER_API_KEY
          unset EVIDENCE_SIGNING_SEED_HEX PRIOR_SEMANTIC_REGISTRY_JSON ENCRYPTION_PUBLIC_KEY

          jq -e '
            type == "array"
            and all(.[]; type == "string" and test("^[0-9a-f]{64}$"))
            and (length == (unique | length))
          ' "$registry_file" >/dev/null
          jq -c '.' "$registry_file" > "$private_root/registry.canonical.json"
          install -m 0600 "$private_root/registry.canonical.json" "$registry_file"
          rm -f -- "$private_root/registry.canonical.json"
          prior_count="$(jq -r 'length' "$registry_file")" || exit 1
          [[ "$prior_count" =~ ^[0-9]+$ ]]
          prior_semantics_file="$private_root/prior-semantics.txt"
          jq -r '.[]' "$registry_file" > "$prior_semantics_file"
          mapfile -t prior_semantics < "$prior_semantics_file"
          rm -f -- "$prior_semantics_file"
          (( ${#prior_semantics[@]} == prior_count ))
          registry_sha="$(sha256sum "$registry_file" | awk '{print $1}')"

          if grep -Fq 'BEGIN PGP PRIVATE KEY BLOCK' "$encryption_key_file"; then
            echo "encryption material must contain only a public OpenPGP key" >&2
            exit 1
          fi
          grep -Fq 'BEGIN PGP PUBLIC KEY BLOCK' "$encryption_key_file"
          export GNUPGHOME="$gnupg_home"
          gpg --batch --quiet --import "$encryption_key_file"
          if gpg --batch --with-colons --list-secret-keys 2>/dev/null | grep -q '^sec:'; then
            echo "encryption key import unexpectedly contained private key material" >&2
            exit 1
          fi
          mapfile -t imported_primary_fingerprints < <(
            gpg --batch --with-colons --list-keys 2>/dev/null \
              | awk -F: '$1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }'
          )
          if (( ${#imported_primary_fingerprints[@]} != 1 )) \
            || [[ "${imported_primary_fingerprints[0]}" != "$encryption_recipient" ]]; then
            echo "protected encryption key does not uniquely match the pinned recipient" >&2
            exit 1
          fi

          forbidden_args=()
          for digest in "${prior_semantics[@]}"; do
            forbidden_args+=(--forbid-semantic "$digest")
          done

          live_log="$private_root/dialogue-live.log"
          if ! (
            cd "$GITHUB_WORKSPACE"
            ALPHA_DIALOGUE_BUILDER_MODEL="$BUILDER_MODEL" \
            ALPHA_DIALOGUE_BUILDER_BASE_URL="$BUILDER_BASE_URL" \
            ALPHA_DIALOGUE_BUILDER_TIMEOUT_SECS="$BUILDER_TIMEOUT_SECS" \
            ALPHA_DIALOGUE_BUILDER_API_KEY_FILE="$builder_key_file" \
            ALPHA_DIALOGUE_REVIEWER_MODEL="$REVIEWER_MODEL" \
            ALPHA_DIALOGUE_REVIEWER_BASE_URL="$REVIEWER_BASE_URL" \
            ALPHA_DIALOGUE_REVIEWER_TIMEOUT_SECS="$REVIEWER_TIMEOUT_SECS" \
            ALPHA_DIALOGUE_REVIEWER_API_KEY_FILE="$reviewer_key_file" \
            ALPHA_DIALOGUE_CONTRACT_TESTER_MODEL="$CONTRACT_TESTER_MODEL" \
            ALPHA_DIALOGUE_CONTRACT_TESTER_BASE_URL="$CONTRACT_TESTER_BASE_URL" \
            ALPHA_DIALOGUE_CONTRACT_TESTER_TIMEOUT_SECS="$CONTRACT_TESTER_TIMEOUT_SECS" \
            ALPHA_DIALOGUE_CONTRACT_TESTER_API_KEY_FILE="$contract_tester_key_file" \
            taskset --cpu-list "$ALPHA_V05_CPU" \
              nice -n 10 \
              timeout --signal=TERM --kill-after=30s 1800s \
              "$ALPHA_V05_DIALOGUE_BIN" \
                --live \
                --evidence-dir "$evidence_dir" \
                --evidence-signing-key-file "$signing_seed_file" \
                "${forbidden_args[@]}"
          ) >"$live_log" 2>&1; then
            echo "live dialogue proof failed; raw transcript was withheld and cleaned" >&2
            exit 1
          fi

          test -d "$evidence_dir"
          test ! -L "$evidence_dir"
          index_file="$evidence_dir/evidence-index.v1.json"
          test -f "$index_file"
          test ! -L "$index_file"
          index_sha="$(sha256sum "$index_file" | awk '{print $1}')"
          [[ "$index_sha" =~ ^[0-9a-f]{64}$ ]]
          seal_file="$private_root/evidence-seal-${index_sha}.v1.json"
          test -f "$seal_file"
          test ! -L "$seal_file"
          mapfile -t seal_files < <(
            find "$private_root" -maxdepth 1 -type f -name 'evidence-seal-*.v1.json' -print
          )
          (( ${#seal_files[@]} == 1 ))
          test "${seal_files[0]}" = "$seal_file"
          jq -e --arg index "$index_sha" --arg signer "$EXPECTED_EVIDENCE_SIGNER" '
            .seal.index_sha256 == $index and .signer_public_key == $signer
          ' "$seal_file" >/dev/null

          verifier_report="$private_root/offline-verification-report.v1.json"
          verifier_error="$private_root/offline-verification-error.log"
          verifier_args=(
            verify-live
            --expected-seal-signer "$EXPECTED_EVIDENCE_SIGNER"
            --candidate-sha "$CANDIDATE_SHA"
            --packaged-binary "$ALPHA_V05_DIALOGUE_BIN"
            --evidence-dir "$evidence_dir"
            --signed-seal "$seal_file"
          )
          for digest in "${prior_semantics[@]}"; do
            verifier_args+=(--forbid-semantic "$digest")
          done
          if ! taskset --cpu-list "$ALPHA_V05_CPU" \
            nice -n 10 \
            "$ALPHA_V05_DIALOGUE_BIN" "${verifier_args[@]}" \
              >"$verifier_report" 2>"$verifier_error"; then
            echo "independent offline verification refused the live evidence" >&2
            exit 1
          fi

          jq -e \
            --arg index "$index_sha" \
            --arg binary "$ALPHA_V05_DIALOGUE_SHA256" \
            --arg builder_model "$BUILDER_MODEL" \
            --arg reviewer_model "$REVIEWER_MODEL" \
            --arg tester_model "$CONTRACT_TESTER_MODEL" '
            type == "object"
            and keys == [
              "binary_sha256",
              "builder_model",
              "contract_tester_model",
              "index_sha256",
              "reviewer_model",
              "semantic_sha256"
            ]
            and .index_sha256 == $index
            and .binary_sha256 == $binary
            and (.semantic_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
            and .builder_model == $builder_model
            and .reviewer_model == $reviewer_model
            and .contract_tester_model == $tester_model
          ' "$verifier_report" >/dev/null
          semantic_sha="$(jq -r '.semantic_sha256' "$verifier_report")"
          verified_builder_model="$(jq -r '.builder_model' "$verifier_report")"
          verified_reviewer_model="$(jq -r '.reviewer_model' "$verifier_report")"
          verified_tester_model="$(jq -r '.contract_tester_model' "$verifier_report")"
          for digest in "${prior_semantics[@]}"; do
            if [[ "$digest" == "$semantic_sha" ]]; then
              echo "verified semantic digest was already present in the prior registry" >&2
              exit 1
            fi
          done
          test "$(sha256sum "$registry_file" | awk '{print $1}')" = "$registry_sha"

          test "$(sha256sum "$ALPHA_V05_DIALOGUE_BIN" | awk '{print $1}')" \
            = "$ALPHA_V05_DIALOGUE_SHA256"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_SHA"
          tree_status="$(git status \
            --porcelain=v1 --untracked-files=normal --ignore-submodules=none)" || exit 1
          test -z "$tree_status"

          binary_name="dialogue-${ALPHA_V05_DIALOGUE_SHA256}"
          seal_name="$(basename "$seal_file")"
          verification_name="offline-verification-report.v1.json"
          manifest_file="$private_root/acceptance-manifest.v1.json"
          seal_sha="$(sha256sum "$seal_file" | awk '{print $1}')"
          verification_sha="$(sha256sum "$verifier_report" | awk '{print $1}')"
          jq -n \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg binary_file "$binary_name" \
            --arg binary_sha "$ALPHA_V05_DIALOGUE_SHA256" \
            --arg index_sha "$index_sha" \
            --arg seal_file "$seal_name" \
            --arg seal_sha "$seal_sha" \
            --arg signer "$EXPECTED_EVIDENCE_SIGNER" \
            --arg verification_file "$verification_name" \
            --arg verification_sha "$verification_sha" \
            --arg semantic_sha "$semantic_sha" \
            --arg builder_model "$verified_builder_model" \
            --arg reviewer_model "$verified_reviewer_model" \
            --arg tester_model "$verified_tester_model" \
            --arg registry_sha "$registry_sha" \
            --argjson prior_count "$prior_count" \
            --arg encryption_recipient "$encryption_recipient" '
              {
                schema: "alpha.v05-live-acceptance-manifest.v1",
                candidate_sha: $candidate_sha,
                source: {repository: $repository, workflow_ref: $workflow_ref},
                workflow: {run_id: $run_id, run_attempt: $run_attempt},
                binary: {file: $binary_file, sha256: $binary_sha},
                evidence: {
                  directory: "evidence",
                  index_file: "evidence-index.v1.json",
                  index_sha256: $index_sha,
                  signed_seal_file: $seal_file,
                  signed_seal_sha256: $seal_sha,
                  expected_signer_public_key: $signer
                },
                offline_verification: {
                  report_file: $verification_file,
                  report_sha256: $verification_sha,
                  semantic_sha256: $semantic_sha
                },
                model_configs: {
                  source: "sealed model-calls.v1.json via offline verification",
                  provider: "openai-compatible",
                  builder: {requested_model: $builder_model},
                  reviewer: {requested_model: $reviewer_model},
                  contract_tester: {requested_model: $tester_model}
                },
                prior_semantic_registry: {sha256: $registry_sha, entries: $prior_count},
                raw_bundle_encryption: {
                  format: "OpenPGP",
                  recipient_fingerprint: $encryption_recipient
                }
              }
            ' > "$manifest_file"
          chmod 0600 "$manifest_file"

          install -m 0500 "$ALPHA_V05_DIALOGUE_BIN" "$raw_stage/$binary_name"
          cp -a -- "$evidence_dir" "$raw_stage/evidence"
          install -m 0600 "$seal_file" "$raw_stage/$seal_name"
          install -m 0600 "$manifest_file" "$raw_stage/acceptance-manifest.v1.json"
          install -m 0600 "$verifier_report" "$raw_stage/$verification_name"
          install -m 0600 "$registry_file" "$raw_stage/prior-semantic-registry.json"
          install -m 0600 "$live_log" "$raw_stage/private-runner-transcript.log"

          install -m 0500 "$ALPHA_V05_DIALOGUE_BIN" "$safe_stage/$binary_name"
          install -m 0600 "$index_file" "$safe_stage/evidence-index.v1.json"
          install -m 0600 "$seal_file" "$safe_stage/$seal_name"
          install -m 0600 "$manifest_file" "$safe_stage/acceptance-manifest.v1.json"
          install -m 0600 "$verifier_report" "$safe_stage/$verification_name"
          cat > "$safe_stage/README.txt" <<'EOF'
          Alpha v0.5 live-acceptance disclosure-safe verification pack.

          This allowlisted pack contains no model prompts, completions, API credentials, operator
          seed, or plaintext raw evidence. The signed index authenticates the separately retained
          encrypted evidence after decryption; it does not make that private evidence public.
          EOF
          chmod 0600 "$safe_stage/README.txt"
          (
            cd "$safe_stage"
            sha256sum \
              "$binary_name" \
              evidence-index.v1.json \
              "$seal_name" \
              acceptance-manifest.v1.json \
              "$verification_name" \
              README.txt > SHA256SUMS
          )
          chmod 0600 "$safe_stage/SHA256SUMS"

          raw_archive="$private_root/alpha-v05-${CANDIDATE_SHA}-raw.tar.gz"
          safe_archive="$private_root/alpha-v05-${CANDIDATE_SHA}-verification.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "$raw_stage" -czf "$raw_archive" .
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "$safe_stage" -czf "$safe_archive" .
          chmod 0600 "$raw_archive" "$safe_archive"

          encrypted_private="$private_root/alpha-v05-${CANDIDATE_SHA}-raw.tar.gz.gpg"
          gpg --batch --yes --quiet --trust-model always \
            --recipient "$encryption_recipient" \
            --output "$encrypted_private" \
            --encrypt "$raw_archive"
          test -s "$encrypted_private"
          gpg --batch --quiet --list-packets "$encrypted_private" >/dev/null

          encrypted_output="$ALPHA_V05_OUTPUT_ROOT/alpha-v05-${CANDIDATE_SHA}-raw.tar.gz.gpg"
          safe_output="$ALPHA_V05_OUTPUT_ROOT/alpha-v05-${CANDIDATE_SHA}-verification.tar.gz"
          test ! -e "$encrypted_output"
          test ! -e "$safe_output"
          install -m 0600 "$encrypted_private" "$encrypted_output"
          install -m 0600 "$safe_archive" "$safe_output"
          test -s "$encrypted_output"
          test -s "$safe_output"

          mapfile -t upload_files < <(
            find "$ALPHA_V05_OUTPUT_ROOT" -mindepth 1 -maxdepth 1 -type f -print
          )
          (( ${#upload_files[@]} == 2 ))
          test -f "$encrypted_output"
          test -f "$safe_output"
          echo "encrypted_path=$encrypted_output" >> "$GITHUB_OUTPUT"
          echo "verification_path=$safe_output" >> "$GITHUB_OUTPUT"
          echo "encrypted_sha256=$(sha256sum "$encrypted_output" | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"
          echo "verification_sha256=$(sha256sum "$safe_output" | awk '{print $1}')" \
            >> "$GITHUB_OUTPUT"
          echo "evidence_index_sha256=$index_sha" >> "$GITHUB_OUTPUT"
          echo "semantic_sha256=$semantic_sha" >> "$GITHUB_OUTPUT"
          echo "evidence_signer=$EXPECTED_EVIDENCE_SIGNER" >> "$GITHUB_OUTPUT"
          echo "builder_model=$verified_builder_model" >> "$GITHUB_OUTPUT"
          echo "reviewer_model=$verified_reviewer_model" >> "$GITHUB_OUTPUT"
          echo "contract_tester_model=$verified_tester_model" >> "$GITHUB_OUTPUT"

      # Attest the copied executable itself (the binary whose digest is in the signed evidence), then
      # both exact upload objects. The private subject is ciphertext; plaintext evidence never leaves
      # the trap-cleaned runner directory.
      - name: Attest exact dialogue binary
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ steps.binary.outputs.path }}

      - name: Attest encrypted raw-evidence package
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ steps.package.outputs.encrypted_path }}

      - name: Attest disclosure-safe verification package
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ steps.package.outputs.verification_path }}

      - name: Upload encrypted raw evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-v05-${{ steps.candidate.outputs.short_sha }}-encrypted-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Upload disclosure-safe verification pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-v05-${{ steps.candidate.outputs.short_sha }}-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.verification_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
