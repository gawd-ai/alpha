[package]
name = "bestiary-live"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Opt-in, key-gated Alpha demo: a real model authors a creature that is compile-checked, signed, admitted, hot-loaded, and published into a durable Bestiary with a verifiable entry proof, journal recovery, and store-level signed-entry convergence. The safe deterministic curator is bound; model-backed curation and transport replication are deliberately not claimed."

# The demo body (`run`) lives in the lib for reuse and focused testing; the binary is a thin wrapper.
# `alpha demo bestiary-live` launches that binary as an external child with the registry's `openai`
# package feature.
[lib]
name = "bestiary_live"
path = "src/lib.rs"

[[bin]]
name = "bestiary-live"
path = "src/main.rs"

# Off by default: the live model backend (ureq/TLS) is pulled in only with `--features openai`. The
# default build links no network code and prints a hint when run (the durable Bestiary loop itself is
# always compiled — only the OpenAI model construction is feature-gated).
[features]
openai = ["mind/openai"]

[dependencies]
aether = { path = "../../cosmos/aether" }
sigil = { path = "../../cosmos/sigil" }
anima = { path = "../../cosmos/anima" }
sanctum = { path = "../../cosmos/sanctum" }
mind = { path = "../../cosmos/mind" }
agent-mind = { path = "../../cosmos/creatures/agent-mind" }
agent-templated = { path = "../../cosmos/creatures/agent-templated" }
build-cargo = { path = "../../cosmos/creatures/build-cargo" }
build-critter = { path = "../../cosmos/creatures/build-critter" }
bestiary = { path = "../../cosmos/bestiary" }
bestiary-daemon = { path = "../../cosmos/creatures/bestiary-daemon" }
policy-signed = { path = "../../cosmos/creatures/prototypes/policies/policy-signed" }
serde_json = { workspace = true }
