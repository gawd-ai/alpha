[package]
name = "walkthrough"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Narrated, runnable Alpha walkthrough of the GAWD substrate — an AI authors → compiles → signs → admits → hot-loads → runs a creature, then a running self migrates between Sanctums. The proof, out of #[test] and into your terminal."

# The demo body (`run`) lives in the lib so `alpha demo walkthrough` can run it in-process;
# the binary is a thin wrapper.
[lib]
name = "walkthrough"
path = "src/lib.rs"

[[bin]]
name = "walkthrough"
path = "src/main.rs"

[dependencies]
aether = { path = "../../cosmos/aether" }
sigil = { path = "../../cosmos/sigil" }
anima = { path = "../../cosmos/anima" }
sanctum = { path = "../../cosmos/sanctum" }
agent-templated = { path = "../../cosmos/creatures/agent-templated" }
build-cargo = { path = "../../cosmos/creatures/build-cargo" }
build-critter = { path = "../../cosmos/creatures/build-critter" }
abode-migrator = { path = "../../cosmos/creatures/abode-migrator" }
policy-signed = { path = "../../cosmos/creatures/prototypes/policies/policy-signed" }
policy-abode-allowlist = { path = "../../cosmos/creatures/prototypes/policies/policy-abode-allowlist" }
serde_json = { workspace = true }
