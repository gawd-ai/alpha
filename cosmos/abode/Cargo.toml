description = "The Abode snapshot/restore contract — the distributed *self* carried between Sanctum bodies. A signed, sha256-bound, size-bounded portable snapshot + the substrate-shipped admission gates (integrity / size / signature) the receiving migrator runs before any injected restore policy. Ships the bytes and the proofs, never a state lattice or a checkpoint scheduler."

