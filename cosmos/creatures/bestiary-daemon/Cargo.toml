[package]
name = "bestiary-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The durable Bestiary creature. Binds an injected BestiaryStore + Curator to Role::REGISTRY, serving every existing RegistryOp byte-identically while persisting to disk, answering the additive bestiary.op schema (ProveEntry / Compact / PushEntries), curating off the drain thread, and replicating to peers via a monotonic-lattice PUSH. registry-mem stays the in-memory stub for the same role."

[dependencies]
aether = { path = "../../aether" }
sigil = { path = "../../sigil" }
bestiary = { path = "../../bestiary" }
gawdxfer = { path = "../../../foundation/gawdxfer" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mind = { path = "../../mind" }
