description = "Reference injected CRDT MergeModel: a Last-Writer-Wins Element-Map over a JSON object `{key: {v, ts}}`. Merge = union of keys, per key the higher `ts` wins (ties broken deterministically). Commutative + associative + idempotent, so abode-reconciler converges on divergent forks regardless of order. Operators write their own lattice (OR-Set, RGA, domain-specific). Not substrate."

