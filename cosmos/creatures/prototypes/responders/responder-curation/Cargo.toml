[package]
name = "responder-curation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Reference standing consumer for the SEER `curation` topic — the external-curator seam for the durable Bestiary. On a curation Query it answers keep / gc / quarantine for a catalog entry from configured lists (default keep). NOT substrate — operators fork the curation model; the in-process AICurator curates over an injected Model instead."

