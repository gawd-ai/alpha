[package]
name = "omega-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A reference Omega-gateway creature — not substrate. Replies with the structured 'deferred' shape that proves the federation address seam; a minimal seam reference alongside the full omega-federator."

[dependencies]
aether = { path = "../../../../aether" }
sigil = { path = "../../../../sigil" }
# The lean `omega-contract` leaf crate owns the gateway seam — the bound Role name and the
# structured `omega.deferred` wire contract this stub replies with. (The stub implements
# `aether::Creature`; `omega` deliberately ships no routing trait — see the omega-contract docs.)
omega-contract = { path = "../../../../omega-contract" }
serde_json = { workspace = true }
