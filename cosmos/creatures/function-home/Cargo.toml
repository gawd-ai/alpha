[package]
name = "function-home"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Reference single-authority durable home ledger for asynchronous GAWD function jobs."

[features]
default = []
# Enables deterministic crash-cut hooks for dependent-crate integration tests. Never enable this
# feature in a production composition.
durability-test-hooks = []

[dependencies]
aether = { path = "../../aether" }
gawdfn = { path = "../../../foundation/gawdfn" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sigil = { path = "../../sigil" }
thiserror = { workspace = true }

[dev-dependencies]
job-blob-fs = { path = "../job-blob-fs" }
