[package]
name = "bestiary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Bestiary contract + the durable store. Carries the registry wire vocabulary (RegistryOp/RegistryReply/Entry/SyncEntry/ReputationScore/QuarantineNotice) shared by registry-mem and the durable daemon, plus the BestiaryStore trait and its FsBestiaryStore reference filling: a realm-hashed, signed-log, content-addressed on-disk Bestiary with a self-owned recover journal, global-union GC, standalone EntryProof attestations, and an injected Curator. A leaf/contract crate — depends only on aether, sigil, and the mind model seam, never on a creature."

[dependencies]
aether = { path = "../aether" }
sigil = { path = "../sigil" }
mind = { path = "../mind" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
